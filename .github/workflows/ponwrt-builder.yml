name: PonWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      SSH:
        type: choice
        required: false
        default: 否
        options:
          - 否
          - 是
      Cache:
        type: choice
        required: false
        default: 使用缓存
        options:
          - 使用缓存
          - 只读缓存
          - 重新编译
          - 不使用缓存

env:
  REPO_URL: https://github.com/1018ji/merge-immortalwrt-ponwrt
  REPO_BRANCH: master
  IMMORTALWRT_URL: https://github.com/immortalwrt/immortalwrt
  PONWRT_URL: https://github.com/pbs05/ponwrt
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai
  # 使用缓存：恢复并保存；只读缓存：只恢复不上传；重新编译：从空缓存编译并保存；不使用缓存：全部关闭
  # 定时或外部触发没有选项，按“使用缓存”处理
  CACHE_MODE: ${{ inputs.Cache || '使用缓存' }}
  # ccache 默认按编译器文件的修改时间判断编译器是否变化，工具链重新编译后会全部不命中，改为按版本判断
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 3G

permissions:
  contents: write
  actions: write

# 同时只跑一个，避免并发保存缓存时互相删除或 key 冲突
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        # tools 的 .prepared 标记文件名里带源码文件的修改时间，固定时间后缓存的工具链才能被识别
        find openwrt/tools openwrt/toolchain -exec touch -h -d @1600000000 {} +
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # 缓存在 clone 之后恢复，否则目录非空会导致 git clone 失败
    # dl 与机型无关，共用一份，按前缀恢复最新的
    - name: Restore download cache
      id: dl-cache
      if: env.CACHE_MODE != '不使用缓存'
      uses: actions/cache/restore@v4
      with:
        path: /workdir/openwrt/dl
        key: openwrt-dl-
        restore-keys: |
          openwrt-dl-

    - name: Restore compiler cache
      if: env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '只读缓存'
      uses: actions/cache/restore@v4
      with:
        path: /workdir/openwrt/.ccache
        key: openwrt-ccache-an7581-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          openwrt-ccache-an7581-

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        # 编译日志写到 logs/，失败时上传
        sed -i '/^CONFIG_BUILD_LOG=/d; /^# CONFIG_BUILD_LOG is not set$/d' .config
        echo 'CONFIG_BUILD_LOG=y' >> .config
        if [ "$CACHE_MODE" != "不使用缓存" ]; then
          sed -i '/^CONFIG_DEVEL=/d; /^# CONFIG_DEVEL is not set$/d; /^CONFIG_CCACHE=/d; /^# CONFIG_CCACHE is not set$/d' .config
          printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
        fi

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        echo "dl_key=openwrt-dl-$(find dl -type f -printf '%P %s\n' | LC_ALL=C sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # key 按 dl 文件列表计算，没有新下载的文件时跳过上传
    - name: Save download cache
      if: (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译') && steps.package.outputs.dl_key != steps.dl-cache.outputs.cache-matched-key
      uses: actions/cache/save@v4
      with:
        path: /workdir/openwrt/dl
        key: ${{ steps.package.outputs.dl_key }}

    - name: Setup SSH session
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.SSH == '是' }}
      uses: owenthereal/action-upterm@v2
      with:
        detached: true
        limit-access-to-actor: true

    # 工具链缓存：key 由 tools / toolchain / include 等源码和工具链相关配置算出，只接受完全匹配，源码一变就重新编译
    - name: Compute toolchain cache key
      id: toolchain
      if: env.CACHE_MODE != '不使用缓存'
      run: |
        cd openwrt
        BOARD=$(sed -n 's/^CONFIG_TARGET_BOARD="\(.*\)"$/\1/p' .config)
        SUBTARGET=$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\(.*\)"$/\1/p' .config)
        HASH=$({
          git rev-parse HEAD:tools HEAD:toolchain HEAD:include HEAD:rules.mk "HEAD:target/linux/$BOARD/Makefile"
          git rev-parse "HEAD:target/linux/$BOARD/$SUBTARGET/target.mk" 2>/dev/null || true
          grep -E '^CONFIG_(ARCH|TARGET_ARCH_PACKAGES|CPU_TYPE|TARGET_OPTIMIZATION|EXTRA_OPTIMIZATION|SOFT_FLOAT|GCC_|BINUTILS_|LIBC|MUSL|GLIBC|TOOLCHAIN|EXTERNAL_TOOLCHAIN|USE_|CCACHE|DEVEL|INSTALL_|GDB|SSP_|BUILD_NLS)' .config
        } | sha256sum | cut -c1-16)
        echo "key=openwrt-toolchain-an7581-$HASH" >> "$GITHUB_OUTPUT"

    - name: Restore toolchain cache
      id: toolchain-cache
      if: env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '只读缓存'
      uses: actions/cache/restore@v4
      with:
        path: |
          /workdir/openwrt/staging_dir/host
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/host
          /workdir/openwrt/build_dir/toolchain-*
        key: ${{ steps.toolchain.outputs.key }}

    - name: Compile tools and toolchain
      id: toolchain-build
      env:
        CACHE_HIT: ${{ steps.toolchain-cache.outputs.cache-hit }}
      run: |
        cd openwrt
        # 恢复的文件统一刷新为当前时间，避免比本次新生成的 .config 等文件旧而触发重新编译
        if [ "$CACHE_HIT" = "true" ]; then
          find staging_dir/host staging_dir/toolchain-* build_dir/host build_dir/toolchain-* -exec touch -h -d "@$(date +%s)" {} +
        fi
        make -j$(nproc) tools/install toolchain/install || make -j1 V=s tools/install toolchain/install

    - name: Remove stale toolchain cache
      if: steps.toolchain-build.outcome == 'success' && env.CACHE_MODE == '重新编译'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh cache delete "${{ steps.toolchain.outputs.key }}" || true

    # 工具链编译完立即保存，后面固件编译失败或取消也不影响
    - name: Save toolchain cache
      if: steps.toolchain-build.outcome == 'success' && (env.CACHE_MODE == '重新编译' || (env.CACHE_MODE == '使用缓存' && steps.toolchain-cache.outputs.cache-hit != 'true'))
      uses: actions/cache/save@v4
      with:
        path: |
          /workdir/openwrt/staging_dir/host
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/host
          /workdir/openwrt/build_dir/toolchain-*
        key: ${{ steps.toolchain.outputs.key }}

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # job 上限 6 小时，到点被强杀后续步骤都不会执行；预留 20 分钟，超时主动失败以便保存 ccache
        DEADLINE=$((JOB_START + 6 * 3600 - 20 * 60))
        run() {
          LEFT=$((DEADLINE - $(date +%s)))
          [ "$LEFT" -gt 0 ] || { echo "no time left"; return 124; }
          timeout -k 60 "$LEFT" "$@"
        }
        run make -j$(nproc) || { RC=$?; [ "$RC" -eq 124 ] && { echo "compile timed out"; exit 1; }; run make -j1 V=s; }
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: /workdir/openwrt/logs
        if-no-files-found: ignore

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Show compiler cache statistics
      if: always() && steps.toolchain-build.outcome != 'skipped' && env.CACHE_MODE != '不使用缓存'
      run: |
        [ -x openwrt/staging_dir/host/bin/ccache ] && CCACHE_DIR=/workdir/openwrt/.ccache openwrt/staging_dir/host/bin/ccache -s || true

    # 编译失败也保存，下次重试可以复用；编译步骤没运行时不保存，避免空缓存覆盖
    - name: Save compiler cache
      if: always() && steps.toolchain-build.outcome != 'skipped' && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
      uses: actions/cache/save@v4
      with:
        path: /workdir/openwrt/.ccache
        key: openwrt-ccache-an7581-${{ github.run_id }}-${{ github.run_attempt }}

    # 每类缓存只保留最新一份，避免超过仓库 10GB 上限后被自动淘汰
    - name: Remove old caches
      if: always() && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        for PREFIX in openwrt-dl- openwrt-ccache-an7581- openwrt-toolchain-an7581-; do
          gh cache list --key "$PREFIX" --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' |
          while read -r ID; do
            echo "deleting cache $ID ($PREFIX)"
            gh cache delete "$ID"
          done
        done

    - name: Publish firmware to release
      id: publish
      if: steps.compile.outputs.status == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        shopt -s nullglob
        FILES=(openwrt/bin/targets/airoha/an7581/*.itb)
        [ ${#FILES[@]} -gt 0 ] || { echo "no firmware found"; exit 1; }
        for F in sha256sums config.buildinfo; do
          [ -e "openwrt/bin/targets/airoha/an7581/$F" ] && FILES+=("openwrt/bin/targets/airoha/an7581/$F")
        done
        TAG="$(TZ="$TZ" date +%Y-%m-%d-%H-%M-%S-%3N)"
        cd openwrt
        git fetch -q "$IMMORTALWRT_URL" master:refs/remotes/upstream/immortalwrt
        git fetch -q "$PONWRT_URL" master:refs/remotes/upstream/ponwrt
        {
          echo "| 项目 | Commit |"
          echo "| --- | --- |"
          echo "| 源码 | $(git rev-parse HEAD) |"
          echo "| code immortalwrt | $(git merge-base HEAD upstream/immortalwrt) |"
          echo "| code ponwrt | $(git merge-base HEAD upstream/ponwrt) |"
          grep '^src-git' feeds.conf.default | while read -r _ NAME _; do
            echo "| feed ${NAME} | $(git -C "feeds/$NAME" rev-parse HEAD) |"
          done
        } > "$RUNNER_TEMP/notes.md"
        cat "$RUNNER_TEMP/notes.md"
        cd ..
        gh release create "$TAG" "${FILES[@]}" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"

    - name: Keep latest 7 releases
      if: steps.publish.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release list --limit 200 --json tagName,isDraft,createdAt \
          --jq '[.[] | select(.isDraft | not) | select(.tagName | test("^[0-9]{4}(-[0-9]{2}){5}-[0-9]{3}$"))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
        while read -r OLD; do
          echo "deleting release $OLD"
          gh release delete "$OLD" --yes --cleanup-tag
        done

    - name: Keep latest 7 workflow runs
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh run list --workflow "${{ github.workflow }}" --status completed --limit 200 --json databaseId,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[6:] | .[].databaseId' |
        while read -r ID; do
          echo "deleting workflow run $ID"
          gh run delete "$ID"
        done
